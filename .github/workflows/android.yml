# Builds the Effort Steps Android app, checks it on an emulator, and publishes it as a download
# (github.com/Kirish-Vijay/effort/releases/latest/download/effort-steps.apk).
# It only publishes builds signed with the real key (the ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASSWORD
# secrets), so nobody installs a build that a later update can't replace.
name: Android app

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.key.outputs.signed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Signing key
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/release.jks
            echo "signed=1" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No signing key secret yet: building a test build that won't be published."
            echo "signed=0" >> "$GITHUB_OUTPUT"
          fi
      - name: Build
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: gradle assembleRelease --no-daemon --stacktrace
      - run: cp android/app/build/outputs/apk/release/app-release.apk effort-steps.apk
      - uses: actions/upload-artifact@v4
        with:
          name: effort-steps
          path: effort-steps.apk

  emulator:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: effort-steps
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Signs in as a throwaway "CI test (ignore)" account (it's in no squad), with every permission granted,
      # then checks the game loaded in the app and that steps and scrolling reached the server.
      - name: Open the game in the app and check it syncs
        uses: reactivecircus/android-emulator-runner@v2
        env:
          CI_TOKEN: gGYk9mF2WtGe6KdPRZUAWG2S
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r effort-steps.apk
            adb shell pm grant io.github.kirishvijay.effort android.permission.health.READ_STEPS
            adb shell pm grant io.github.kirishvijay.effort android.permission.POST_NOTIFICATIONS
            adb shell appops set io.github.kirishvijay.effort GET_USAGE_STATS allow
            adb shell am start -W -a android.intent.action.VIEW -d "effort://connect?t=$CI_TOKEN" io.github.kirishvijay.effort
            sleep 45
            adb exec-out screencap -p > 1-game.png
            adb shell uiautomator dump /sdcard/ui1.xml && adb pull /sdcard/ui1.xml ui1.xml
            curl -s -X POST "https://nfsogyreyownlchwdnff.supabase.co/functions/v1/effort/game" -H "Content-Type: application/json" -d "{\"token\":\"$CI_TOKEN\"}" > game.json
            jq '{steps_source: .me.steps_source, steps_synced_at: .me.steps_synced_at, scroll_synced_at: .me.scroll_synced_at}' game.json
            jq -e '.me.steps_source == "android-app" and (now - ((.me.steps_synced_at[0:19] + "Z") | fromdateiso8601)) < 600' game.json
            jq -e '(now - ((.me.scroll_synced_at[0:19] + "Z") | fromdateiso8601)) < 600' game.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-screens
          path: |
            *.png
            *.xml
            game.json

  publish:
    needs: [build, emulator]
    if: needs.build.outputs.signed == '1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: effort-steps
      # The game compares the version in this title with the installed app's and offers the update.
      - name: Publish the download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete steps-app --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create steps-app effort-steps.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title "Effort for Android 1.${{ github.run_number }}" \
            --notes "The Effort game for Android, with one-tap steps, scroll tracking and the 6:45pm ping. Install it over the old one: your account and progress stay."
